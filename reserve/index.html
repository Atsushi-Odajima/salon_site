<!doctype html>
<html lang="ja">
  <head>
<!--partial:head-->
    <title>Web予約（デモ）｜【制作見本】hair &amp; spa 凪</title>
    <meta name="description" content="美容室ホームページ制作見本の予約デモです。メニュー・スタッフ・日時を選ぶと、空いている枠だけが表示されます。実際の予約・送信は行われません。" />
    <meta property="og:title" content="Web予約（デモ）｜【制作見本】hair &amp; spa 凪" />
    <meta property="og:description" content="メニュー・スタッフ・日時を選ぶ予約の操作体験（制作見本・架空店舗）。" />
  </head>
  <body class="page-reserve">
    <a class="skip-link" href="#main">本文へ移動</a>
<!--partial:ribbon-->
<!--partial:header-->

    <main id="main" class="container reserve">
      <div class="reserve-head">
        <p class="eyebrow">Reservation</p>
        <h1 class="serif reserve-title">Web予約</h1>
        <div class="alert alert--demo" role="note">
          <span data-icon="info-circle"></span>
          <p style="margin:0"><b>操作体験用のデモです。</b>実際の予約・送信・通知は行われません。入力内容はお使いのブラウザ内にだけ保存されます。</p>
        </div>
      </div>

      <ol class="progress" data-progress aria-label="予約の手順">
        <li data-step="1"><span>1</span>メニュー</li>
        <li data-step="2"><span>2</span>担当・日時</li>
        <li data-step="3"><span>3</span>お客様情報</li>
        <li data-step="4"><span>4</span>確認</li>
      </ol>

      <div class="reserve-grid">
        <div class="reserve-main" data-steps aria-live="off"></div>
        <aside class="reserve-aside" aria-label="選択中の内容" data-aside></aside>
      </div>
      <noscript><p class="alert alert--error">予約デモの表示には JavaScript を有効にしてください。</p></noscript>
    </main>

<!--partial:footer-->
<!--partial:demo-dialog-->
    <script type="module" src="/src/pages/reserve.ts"></script>
